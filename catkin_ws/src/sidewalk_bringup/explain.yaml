package: sidewalk_bringup
phase: 1
title: "Bringup — Starting the Robot's Nervous System"
status: ready
one_liner: "The single command that starts everything, and the map of how the robot's body parts relate to each other in space."

audience_summary: |
  Think of a robot as a body. The camera is an eye, the wheels are legs, the
  computer is a brain. None of those parts are useful on their own — what makes
  a robot work is that they are connected, and that each one knows where the
  others are.

  This package is that connection. It does two jobs. First, it is the "on
  switch": one command starts every piece of software in the right order, so
  you never have to remember which of nine programs to launch first. Second, it
  holds the robot's body map — a precise description of where the camera sits
  relative to the wheels, measured in millimetres.

  That second job sounds boring. It is the single most common cause of a failed
  robotics experiment. If the software thinks the camera is 10 cm further
  forward than it really is, every measurement the robot makes will be wrong by
  10 cm, and no amount of clever algorithm work will fix it.

why_it_exists: |
  A running robot is not one program. It is a dozen programs talking to each
  other at the same time — camera driver, mapping, navigation, logging. Starting
  those by hand is slow and easy to get wrong, and getting the order wrong
  produces confusing failures that look like algorithm bugs.

  Centralising startup means an experiment can be reproduced exactly. That
  matters for research: a result nobody can reproduce is not a result.

physical_intuition: |
  For a mechanical engineer, the body map here is just a **coordinate transform
  chain** — the same thing you build when you stack reference frames in a CAD
  assembly. Each link in the chain says "frame B sits this far, and rotated this
  much, from frame A".

  The robot's chain runs: world → map → odometry → robot base → camera mount →
  camera lens. Any error anywhere in that chain propagates to everything
  downstream, exactly like a tolerance stack-up in an assembly drawing.

  And like a tolerance stack, the error that hurts you most is usually angular.
  A 1 degree mounting error in the camera's pitch does almost nothing to an
  object 10 cm away, but it displaces a point 20 m away by about 35 cm. This is
  why the mounting bracket's rigidity is a SLAM problem, not just a mechanical
  one.

what_it_does:
  - Defines every coordinate frame on the robot and how they relate, in a URDF description
  - Publishes those relationships continuously so every other program can ask "where is the camera right now?"
  - Provides one launch file per phase, so each stage of the project starts with a single command
  - Centralises all tunable numbers into YAML config files instead of scattering them through code
  - Sets up logging so every run leaves a permanent, timestamped record
  - Runs a preflight check that refuses to start if something important is missing

key_concepts:
  - term: "Node"
    plain: "One running program that does one job — for example, the program that talks to the camera. A robot runs many at once."
    technical: "An executable process registered with the ROS master, communicating over TCPROS/UDPROS."
  - term: "Topic"
    plain: "A named channel that programs use to broadcast information. The camera publishes pictures to a channel; anyone who wants pictures listens to that channel. The publisher does not know or care who is listening."
    technical: "A named, typed, many-to-many asynchronous message bus with publisher/subscriber semantics."
  - term: "TF (transform) tree"
    plain: "The robot's body map — a live, constantly-updated record of where every part is relative to every other part."
    technical: "A time-indexed directed tree of coordinate frame transforms, queryable at arbitrary timestamps with interpolation."
  - term: "URDF"
    plain: "A text file describing the robot's physical shape and dimensions — essentially a simplified CAD model the software can read."
    technical: "Unified Robot Description Format: an XML schema for kinematic and visual robot models."
  - term: "Launch file"
    plain: "A recipe listing which programs to start, in what order, with which settings."
    technical: "An XML declaration of nodes, parameters, remappings and nested includes, executed by roslaunch."

inputs:
  - "`config/robot_frames.yaml` — the measured physical offsets between robot parts"
  - "`config/camera_mount.yaml` — where the ZED X sits and how it is oriented"
  - "Phase selection, chosen by which launch file you run"

outputs:
  - "A live TF tree, published continuously on `/tf` and `/tf_static`"
  - "The robot model on `/robot_description`, which visualisation tools read"
  - "A timestamped run log in `logs/sidewalk_bringup/`"
  - "A preflight report saying whether the system is fit to run"

how_to_run:
  - cmd: "roslaunch sidewalk_bringup preflight.launch"
    explain: "Run this FIRST, every session. It checks the camera is detected, the transform chain is complete, disk space is sufficient and no clock skew exists — then tells you plainly whether you are safe to proceed. It changes nothing; it only reports."
  - cmd: "roslaunch sidewalk_bringup bringup.launch"
    explain: "Starts the core system: robot description, transform publishers and logging. This is the foundation every other phase builds on."
  - cmd: "roslaunch sidewalk_bringup bringup.launch camera:=true"
    explain: "The same, plus the ZED X camera driver. Use this once the camera is physically wired."
  - cmd: "rosrun sidewalk_bringup hello_ros.py"
    explain: "A deliberately tiny teaching program. It publishes a counter, subscribes to it, and prints what it receives — demonstrating the publish/subscribe idea in about forty lines. Read the source; it is commented line by line."
  - cmd: "rosrun rqt_tf_tree rqt_tf_tree"
    explain: "Draws the robot's body map as a diagram. Every frame should be connected to every other. A frame floating on its own means a transform is missing, and anything depending on it will silently produce wrong answers."

failure_modes:
  - symptom: "`rqt_tf_tree` shows a disconnected frame"
    cause: "A transform in the chain is not being published, usually a typo in a frame name"
    fix: "Check the frame names in `config/robot_frames.yaml` match exactly what the camera driver publishes. Names are case-sensitive and a trailing space will break them."
  - symptom: "Everything starts but no data appears anywhere"
    cause: "`ROS_IP` is unset, so nodes advertise an address other machines cannot reach"
    fix: "This exact bug existed on the old system. `bringup.launch` now sets `ROS_IP` explicitly — verify with `echo $ROS_IP`."
  - symptom: "`roslaunch` cannot find the package"
    cause: "The workspace was not sourced in this terminal"
    fix: "Run `source ~/catkin_ws/devel/setup.bash`, then try again. Every new terminal needs this."
  - symptom: "Timestamps look wrong, or data is rejected as too old"
    cause: "Clock mismatch between machines"
    fix: "Preflight checks this. Ensure both machines run NTP and agree to within a few milliseconds."
  - symptom: "Preflight reports the camera is missing"
    cause: "Driver not installed, camera not wired, or daemon not running"
    fix: "Run `tools/health_check.sh` for a full diagnosis — it distinguishes these three cases."

files:
  - path: "launch/preflight.launch"
    role: "Safety check run before every session; reports readiness and changes nothing"
  - path: "launch/bringup.launch"
    role: "Master startup — the single on switch"
  - path: "urdf/sidewalk_robot.urdf.xacro"
    role: "The robot's physical description: dimensions, frames, camera mounting"
  - path: "config/robot_frames.yaml"
    role: "Measured offsets between robot parts. Update this whenever hardware moves."
  - path: "config/camera_mount.yaml"
    role: "ZED X position and orientation relative to the robot base"
  - path: "scripts/hello_ros.py"
    role: "Teaching example: publisher, subscriber and service in one commented file"
  - path: "scripts/preflight_check.py"
    role: "The readiness check logic"
  - path: "scripts/run_logger.py"
    role: "Shared logging helper used by every package in this project"

logs: "logs/sidewalk_bringup/"
