package: sidewalk_perception
phase: 2
title: "Perception — Giving the Robot Eyes, and Proving They Work"
status: ready
one_liner: "Brings the stereo camera online, proves the pictures it produces are trustworthy, and turns them into the two things the navigation system needs: what is in the way, and where the pavement stops."

audience_summary: |
  This package does two things. The first is obvious and the second is the one
  that matters.

  The obvious job is turning the camera on. The robot's eye is a **ZED X**, a
  stereo camera — two cameras side by side, 12 centimetres apart, like a pair of
  human eyes. Just as your two eyes see slightly different views and your brain
  turns that difference into a sense of depth, this camera compares its two
  images to work out how far away everything is. It also contains a motion
  sensor that reports which way it is tilting and turning, four hundred times a
  second.

  The second job is checking that the camera is telling the truth. That sounds
  paranoid. It is not.

  A camera can fail in ways that are completely invisible. It can quietly skip
  one picture in every fifty when the computer gets busy. It can stamp its
  pictures with times that come from a slightly different clock than everything
  else, so the robot thinks it saw things a fraction of a second later than it
  did. Nothing on the screen looks wrong. No error message appears. The pictures
  look perfect.

  But the whole point of this project is to compare three different mapping
  programs and say which one works best on a sidewalk. If the camera is dropping
  pictures, all three programs get worse — and they get worse by *different*
  amounts. We would then publish a finding about mapping software that was
  really a finding about a loose cable. That is the specific disaster this
  package exists to prevent.

  So these tools sit and watch the camera for fifteen minutes at a time and
  count everything — every picture that arrives, every one that goes missing,
  every clock reading, every gap. At the end they give a plain verdict on
  whether the data can be trusted.

  The package also handles recording. When the robot drives somewhere
  interesting, everything the camera saw is saved to disk, so the three mapping
  programs can each be run on that exact same drive afterwards. And every
  recording gets a written record attached to it describing precisely how it was
  made — which camera, mounted how, in what weather, on which version of the
  software. Without that record a recording becomes useless within months,
  because nobody can remember the details that turn out to matter.

  There is a third job, added later, and it is the one that keeps the robot out
  of trouble. The camera produces an enormous cloud of measured points — roughly
  two million of them, several times a second, each one a place in the world the
  camera can see. Most of those points are simply the pavement. The robot does
  not need to be told about the pavement; it needs to be told what is standing
  ON the pavement, and where the pavement runs out.

  So one of the programs here sorts the points into three piles. It works out
  where the ground surface is, sets that aside as "floor, drive on it", and
  hands the rest onward as "things to avoid". That sounds like it should be easy
  — surely anything higher than ten centimetres is an obstacle? — but it is not,
  for a reason anyone who has walked on a pavement will recognise once it is
  pointed out. Pavements are not flat. They are built with a slight sideways
  tilt so rainwater runs off into the gutter instead of pooling. Over the width
  of the area the camera watches, that deliberate tilt adds up to about eight
  centimetres of perfectly normal, perfectly safe height change. And the robot
  itself rocks back on its wheels when it pulls away, tipping the camera up by a
  degree or two, which at the far end of its view lifts everything by twice that
  again. A program that simply measured height would decide the pavement ahead
  was a wall and stop dead. So instead it works out the *slope* of the ground
  each time it looks, and measures everything relative to that. Tilt and rocking
  then cancel out, and what is left sticking up is genuinely sticking up.

  The last pile is the important one: the edge. A kerb is not an object sitting
  on the pavement — it is the pavement itself suddenly changing level, usually
  by about the width of a hand. The program looks for those sudden changes and,
  crucially, notices which way they go. A step UP is a kerb the robot cannot
  climb, which is a nuisance. A step DOWN is the edge of the road, and that is
  far more dangerous, because a drop is invisible to anything looking for tall
  objects — there is nothing there to see. The ground simply stops. The robot
  would read that as clear space and drive straight off it. So drops are treated
  as the most serious thing this package reports, and are marked in a way that
  the navigation system cannot talk itself out of believing.

  Two honest limitations are worth stating plainly. First, the camera cannot see
  the ground right in front of the robot: because of where it is mounted and how
  wide its view is, the nearest patch of ground it can see is about ninety
  centimetres beyond the robot's front edge. Anything that appears in that gap
  without first being seen from further away is invisible. Second, the further
  away something is, the vaguer the camera's sense of exactly where it is, and
  beyond about five metres the uncertainty about where a kerb edge lies grows
  larger than the kerb is useful at. So the program deliberately stops reporting
  kerbs past that distance rather than reporting them badly. There is an
  unresolved question sitting underneath that second limitation, and it should
  not be buried: to keep up with the camera the program throws away most of the
  points before it looks for edges, and depending on exactly how that thinning
  falls, kerb detection may in fact fade out nearer than five metres — perhaps
  around four. It would do so without complaining. Nobody has measured it,
  because no camera is connected. Until somebody does, treat five metres as the
  distance the program is *aiming* at, not one it is known to reach.

why_it_exists: |
  The central contribution of this project is a fair three-way comparison —
  RTAB-Map against the ZED SDK's own tracker against ORB-SLAM3 — on identical
  recorded input. Two things have to be true for that comparison to mean
  anything, and this package is responsible for both.

  First, the input has to be sound. A comparison run on a stream that silently
  drops frames or carries inconsistent timestamps measures the interaction
  between three algorithms and one faulty sensor, not the algorithms. Worse, the
  result would look entirely plausible. There would be numbers, and graphs, and
  a clear winner, and the conclusion would be wrong.

  Second, the input has to be *identical* across the three. Driving the robot
  three times gives three different drives — different light, different
  pedestrians, different tyre slip. Recording once and replaying three times
  removes that entire class of confounding variable, and is also the only way
  the experiment can ever be repeated by somebody else.

  Everything here follows from those two requirements. The validation tools
  exist to establish the first. The recording, replay and dataset-manifest tools
  exist to establish the second.

physical_intuition: |
  A stereo camera is a triangulation instrument, and it obeys the same
  mathematics as any other triangulation instrument. The governing relationship
  is

      Z = f * B / d

  where **Z** is the distance to a point, **f** is the focal length in pixels,
  **B** is the baseline — the 120 mm gap between the two lenses — and **d** is
  the *disparity*, meaning how many pixels the same feature shifts between the
  left and right image. Something close by shifts a lot between the two views.
  Something far away barely shifts at all.

  That last sentence is the whole problem. Depth is inversely proportional to a
  quantity measured in whole pixels, so as distance grows, the measurement being
  relied upon shrinks toward the size of a single pixel. Differentiating the
  relationship gives the error propagation

      sigma_Z ~= Z^2 * sigma_d / (f * B)

  Depth uncertainty grows with the **square** of distance. Double the distance
  and you quadruple the error. This is not a limitation of this particular
  camera or of clever software — it is geometry, and no algorithm can escape it.

  Putting real numbers in makes it concrete. At 1920 pixels wide with the
  datasheet's 73 degree horizontal field of view, the 4.6 mm lens works out to
  about 1297 pixels of focal length. With a 120 mm baseline and assuming the
  stereo matcher can locate a feature to within a quarter of a pixel, the
  predicted uncertainty is about 6 mm at 2 m and about 0.64 m at 20 m — which
  is 0.32% and 3.2% of the distance.

  Those two distances are chosen because they are the only two at which the
  manufacturer states an accuracy: the datasheet says the error is under 0.4%
  out to 2 m and under 7% at 20 m. The formula's 0.32% and 3.2% both sit inside
  those bounds, which is the agreement we want — it confirms that this simple
  model captures what the camera really does, and so can be trusted to predict
  behaviour at distances nobody has measured yet.

  A correction worth recording, because it is the kind of mistake that hides
  well. Until 2026-08-29 this passage compared the formula against "0.2% at
  1 m and 3.1% at 15 m" and reported close agreement. Those two figures are not
  in the datasheet. They had been written from memory somewhere in this
  project's history and then quoted onward as though the manufacturer had said
  them, and the "agreement" was between a formula and an invention. The lens
  focal length (4 mm, really 4.6) and the field of view (80 degrees, really 73)
  were wrong in the same passage and for the same reason. All are now read off
  the datasheet PDF in `Official Resources/`.

  This is also why the camera is rated 1 m to 35 m and not further. It is a
  design trade-off of exactly the kind found in any instrument. A wider baseline
  would improve distant accuracy — but it would also enlarge the region close to
  the camera where the two lenses cannot both see the same thing, raising that
  1 m floor, and it would make the whole assembly bigger and harder to mount
  rigidly. 120 mm is the compromise chosen for this camera's intended range.

  **Why the mount is a perception problem, not just a bracket.** The camera-to-
  wheels transform is a datum, and errors in it propagate exactly like a
  tolerance stack-up in an assembly. Angular error dominates, because its effect
  scales with distance — a 1 degree pitch error is negligible for something
  10 cm away but displaces a point 20 m away by about 35 cm. And a bracket that
  flexes is worse than one that is merely misaligned. A fixed misalignment is a
  constant offset that calibration can remove; a flexing bracket makes the datum
  a function of acceleration, which nothing can remove after the fact. Bracket
  stiffness is a mapping-accuracy specification.

  **Why the global shutter matters.** This camera exposes every pixel of the
  sensor at the same instant. A cheaper rolling-shutter sensor exposes one row
  after another, taking a few milliseconds to sweep from top to bottom. On a
  stationary tripod nobody notices. On a robot rolling over paving joints, the
  top and bottom of a single image are captured at measurably different moments,
  so a vertical post photographed while the robot vibrates comes out leaning —
  and the amount of lean depends on the vibration at that instant. Every
  straight line in the scene becomes a slightly different shape in every frame.
  A mapping algorithm trying to recognise a place it has been before is then
  matching against geometry that changes with the suspension. A global shutter
  removes that entire failure mode, which is why it is worth paying for on a
  vehicle that vibrates.

  **Why exposure time is a mechanical quantity here.** At a walking pace of
  1.5 m/s, a 30 millisecond exposure smears the scene across 4.5 cm of travel.
  Visual mapping works by tracking sharp corners between frames, and motion blur
  destroys corners. A short, slightly noisy exposure beats a clean, long one on
  a moving robot. This is why the camera settings cap the automatic exposure
  rather than letting it choose freely in low light.

  ---

  **Where the ground actually starts, and the blind zone that follows.** The
  camera's left lens sits 0.695 m above the *floor*, tilted 3.24 degrees down,
  with a 45 degree vertical field of view. The bottom edge of its picture
  therefore points 3.24 + 22.5 = 25.74 degrees below horizontal, and simple
  trigonometry says that ray meets the ground at

      x = 0.695 / tan(25.74 deg) = 1.44 m

  ahead of the lens. The lens is 0.071 m ahead of the wheel axle, so the
  nearest visible ground is 1.51 m ahead of the robot's centre. The front
  bumper is at 0.495 m. **There is a band 1.02 m deep, the full width of the
  robot, in which this camera never sees the ground at all.** Not "sees it
  poorly" — never sees it. At the 0.6 m/s speed cap that is about 1.7 seconds
  of travel.

  It is worth checking whether the camera's 1 m minimum range makes this worse.
  It does not. The slant distance to that first ground point is
  0.695 / sin(25.74 deg) = 1.60 m, but the camera measures distance along its
  optical axis rather than along the ray, which multiplies by cos(22.5 deg) and
  gives 1.48 m. That clears the 1 m floor by 48 cm. Tilt the camera down far
  enough and the minimum-range limit takes over from the field-of-view limit —
  the blind zone stops shrinking no matter how much more you tilt — but at the
  measured 3.24 degrees that crossover is not close. This is the real
  trade-off behind the mounting angle, and it is a geometry problem, not a
  preference.

  **Three corrections are folded into the paragraphs above, and every one of
  them moved the blind zone in the same, dangerous direction — outward.** Each
  was found separately, and each had made the robot look as though it could see
  more ground than it can.

  The first two were about the mount. Until 2026-08-29 this page said the
  camera was 0.62 m up and tilted 5 degrees down, and put the blind band at
  0.89 m. Those were placeholder figures that had never been measured. The
  mount was then measured — tape to the housing plus the camera's own internal
  offsets read from the live transform tree, and the tilt measured twice by
  two methods that share no failure mode. Separately, the software that
  derives these figures was found to be reading the camera's height in the
  wrong reference: the robot's coordinate origin sits 0.13228 m above the
  floor, and a height measured from that origin had been used as though it
  were a height above the ground. That made every figure here describe a
  camera 132 mm lower than the real one.

  The third was about the camera itself, and it is the one this page most
  deserved to be caught on. The vertical field of view had been recorded as
  52 degrees. **The manufacturer's datasheet says the ZED X sees at most 45
  degrees vertically** — so 52 was not a rounding, it was above the stated
  maximum, and therefore wrong at every setting the camera has. It had been
  written from memory rather than read from the document. A field of view that
  is too wide tips the bottom edge of the picture further down than the lens
  can really look, so the ground appears to come into view sooner than it does.

  Put together, the blind band has been reported as 0.58 m, then 0.82 m, and is
  really 1.02 m. **Under-reporting a blind zone is the dangerous direction to
  be wrong in** — it claims the robot is blind over a shorter stretch of ground
  than it really is, and the argument that the speed cap keeps the stopping
  distance inside that stretch is built on its length. Any older document
  quoting 0.58 m, 0.82 m or 0.89 m predates the corrections. The lesson the
  project has taken from it: read the specification sheet, do not recall it.

  **Why the ground must be fitted rather than assumed.** The instinct is to
  call anything above 10 cm an obstacle. Three ordinary facts defeat it, and all
  three push the same way:

  - Pavements carry a 1-2% *camber* — a deliberate cross-slope so water drains
    to the gutter. Across the 8 m-wide strip the camera watches, 2% is 0.08 m of
    genuine, drivable height change.
  - The robot pitches on its tyres under acceleration. Just 1.5 degrees of nose-
    up tilts the whole measurement; at 8 m ahead that is 8 x tan(1.5 deg) =
    0.21 m, twice the entire obstacle threshold.
  - Driveway aprons and kerb ramps run to 8%, which is 4.6 degrees.

  Each of those is, to first order, exactly a plane. So the software fits a
  plane to the measured points each frame and measures heights relative to *it*.
  Camber, pitch and gradient all live in the fitted plane and vanish from the
  residual, and what remains is what is genuinely standing proud of the
  pavement. This is the same reasoning as levelling an instrument before taking
  readings, except it is redone every tenth of a second because the "instrument"
  is bolted to something with suspension.

  **Why the plane fit must be told roughly where to look.** The standard
  robust-fitting method (RANSAC) picks the plane supported by the most points.
  It has no concept of "ground". On a narrow sidewalk with a building along one
  side, the wall routinely returns *more* points than the pavement: it faces the
  camera more squarely, so it collects far more pixels per square metre, and
  brick is better textured than plain concrete. Unconstrained, the fit happily
  declares the **wall** to be the ground — at which point the pavement becomes a
  10 m tall obstacle, the wall becomes drivable, and the robot turns into the
  building. This is not an exotic edge case; it is the default outcome in that
  geometry, and the self-test reproduces it deliberately: with the constraint
  removed the fit returns a plane tilted 90 degrees.

  The fix costs nothing, because the answer is already known approximately. The
  robot is standing on the ground, so in the robot's own coordinate frame the
  ground passes through height zero with its normal pointing up. Candidate
  planes are therefore rejected if they tilt more than 10 degrees from
  horizontal or sit more than 0.15 m from the origin. Ten degrees comfortably
  swallows camber plus pitch plus a driveway ramp (about 7 degrees at worst) and
  misses a wall by a factor of nine. That gap — 7 degrees of real world versus
  90 degrees of wall — is what makes such a crude gate sufficient.

  **A kerb is a discontinuity, not an object.** This distinction drives the
  whole detector. A kerb is not a thing resting on the ground; it is the ground
  surface itself stepping to a new level, typically 100-150 mm. So it is found
  by comparing the height of neighbouring patches of ground and looking for a
  sudden jump, not by looking for something tall.

  The sign of that jump matters enormously, and the two cases are not
  symmetric. A step **up** is a kerb the robot cannot climb: unpleasant, but a
  collision with it is a bump. A step **down** is the edge of the roadway, and
  it defeats obstacle detection twice over. The road surface lies *below* the
  ground plane, so a height filter finds nothing there; and the camera's rays
  pass over the lip and land beyond it, so the usual "this ray travelled through
  empty space" logic actively *erases* the cells at the edge. Left alone, the
  navigation system's considered opinion of a 150 mm drop into traffic is "free
  space". Drops are therefore reported at the *near* lip rather than the far
  side, and are additionally injected as artificial obstacles at robot height so
  that even a misconfigured costmap refuses to cross them.

  **Why kerb detection stops at about 4 m, and why the obvious reason is the
  wrong one.** Range error grows as the square of distance, roughly
  0.002 x Z^2 metres for this camera. The intuitive worry is height noise, but
  the grazing geometry works in our favour: a ray aimed at the ground far ahead
  is nearly horizontal, so only sin(depression angle) of the range error lands
  in the vertical direction. Working it through, the vertical noise is about
  0.002 x 0.695 x Z — **linear** in distance, not quadratic — giving 7 mm at
  5 m and 14 mm at 10 m. Against a 120 mm kerb, neither is fatal.

  What actually binds is *where along the ground* the edge appears to be. The
  same range error slides the point along the pavement by essentially its full
  magnitude: 0.05 m at 5 m, 0.20 m at 10 m, 0.45 m at 15 m. The navigation grid
  has 0.05 m cells, so at 5 m the uncertainty about **where** the kerb is has
  already grown to one whole cell. At 10 m it is four cells, and a kerb smeared
  across 20 cm of ground is not a barrier — it is either a phantom wall across
  the sidewalk or a hole in the real one, depending on which way the noise fell
  that frame. That argument alone would allow kerbs out to 5.0 m.

  A third and tighter limit is what actually sets the figure, and it comes from
  the software rather than the camera. To keep up at 10 Hz the node thins the
  cloud, keeping roughly one point in every 58, and the ground map needs at
  least three surviving points inside a 0.10 m square before it will use that
  square at all. On the pessimistic reading of how the thinning falls across
  the image, squares start coming up empty beyond 4.46 m — and an empty kerb
  report is indistinguishable from "there was no kerb there". So the shipped
  setting is **3.90 m**, inside that bound rather than outside it. Claiming
  4 m and being reliable within it beats claiming 5 m and being unknowingly
  blind for the last metre.

  (These figures changed on 2026-08-29 along with the mount and field-of-view
  corrections described earlier. The vertical noise coefficient is 0.002 times
  the camera height, so correcting the height from 0.62 m to the true 0.695 m
  raised it by 12 per cent — a higher camera looks down more steeply, so more
  of each range error lands in the vertical direction. Correcting the vertical
  field of view from 52 to the datasheet's 45 degrees moved the thinning limit
  the other way, from 4.11 m out to 4.46 m: a narrower view spreads the same
  1200 rows of pixels over less ground, so each square keeps enough points a
  little further out. The shipped 3.90 m therefore sits *further* inside its
  limit than before, which is slack rather than a problem — and it is
  deliberately left where it is, because moving a tuning value in the same
  breath as a specification correction makes it impossible to say afterwards
  which change caused what. This page previously concluded "report kerbs to
  5 m", which was the depth-noise answer and overlooked the thinning limit
  entirely.)

  One more piece of provenance, because it decides how much to trust the
  numbers above. The 0.002 coefficient is often described in this project as a
  fit to "the datasheet's two anchor points, 0.2% at 1 m and 3.1% at 15 m".
  Neither of those points is in the datasheet. What the manufacturer actually
  publishes is an error under 0.4% out to 2 m and under 7% at 20 m. Those two
  bounds do not lie on a single curve of this shape — the near one implies a
  coefficient of 0.0020 and the far one 0.0035 — so a choice has to be made,
  and 0.002 is the near one. It is therefore the **optimistic** choice, and
  anyone relying on kerb ranges beyond a few metres should know that. Using
  the far bound instead would pull the depth-noise limit from 5.02 m down to
  3.81 m, which is tighter than the shipped 3.90 m setting. Which is right is
  a measurement nobody has made: park the robot a known distance from a
  measured kerb and look at how much the reported distance wanders.

what_it_does:
  - Starts the ZED X camera and publishes rectified left and right images, a depth image, a point cloud, the motion sensor stream and the camera's calibration data
  - Keeps every topic and every coordinate frame name tagged with which camera produced it, so a second camera can be added later without a collision
  - Measures the real frame rate against the requested frame rate over a sustained fifteen-minute run
  - Counts dropped frames two independent ways and explains what it means when the two disagree
  - Checks that timestamps never run backwards, never repeat, and never arrive blank
  - Measures the spread of the gap between consecutive frames, reporting the worst case rather than the average
  - Confirms every sensor stream is stamped from one consistent clock, and detects slow drift between clocks
  - Checks the motion sensor is really delivering its rated four hundred readings per second
  - Verifies the left and right images of each stereo pair carry exactly the same timestamp
  - Reports what fraction of the depth image is actually usable rather than blank
  - Audits coordinate frame names in a recording or a live stream, offline, with no camera attached
  - Records drives to disk in the camera's native format, and replays them so every algorithm sees identical input
  - Writes a provenance record for every recording and turns it into a web page a non-technical reader can understand
  - Fits the ground surface afresh every frame instead of assuming a flat floor, so that pavement camber and the robot rocking on its wheels are not mistaken for obstacles
  - Constrains that fit using the known camera mounting, so a building wall can never be mistaken for the ground
  - Publishes the points that genuinely stick up out of the pavement as the live obstacle feed the navigation system steers by
  - Detects kerbs as sudden steps in the ground surface rather than as tall objects, and reports which way each step goes
  - Treats a drop to the roadway as the most dangerous case, marks it at the near lip, and makes it visible to obstacle logic that would otherwise see empty space
  - Stops reporting kerbs beyond the distance at which the camera's own depth error makes their position untrustworthy
  - Carries a self-test that checks the whole segmentation pipeline on synthetic data with no camera, no ROS and no numpy installed

key_concepts:
  - term: "Stereo disparity"
    plain: "How far a given object appears to shift between the left and right image. Hold a finger up and blink each eye in turn — it jumps. Near things jump a lot, far things barely move, and the size of that jump is what reveals distance."
    technical: "The horizontal pixel offset between corresponding points in a rectified stereo pair, related to depth by Z = fB/d and used to produce a dense disparity map."
  - term: "Depth uncertainty growth"
    plain: "The camera is very precise about nearby things and increasingly vague about distant ones, and it gets worse fast — going twice as far away makes the error four times bigger, not twice."
    technical: "Quadratic error propagation, sigma_Z proportional to Z^2 * sigma_d / (fB), arising from differentiating the inverse relationship between depth and disparity."
  - term: "Baseline"
    plain: "The gap between the two lenses, 120 mm on this camera. It is the single most important number for how far away the camera can still judge distance — the same reason your depth perception is better than a bird's with eyes on the sides of its head."
    technical: "The stereo rig's inter-camera translation; it scales depth resolution linearly and sets the minimum range through the shared field of view."
  - term: "Global shutter"
    plain: "Every part of the picture is captured at the same instant, like a camera flash freezing a moment. The cheaper alternative scans down the image, so a picture taken while shaking comes out warped."
    technical: "Simultaneous exposure of the full pixel array, eliminating the spatio-temporal skew that rolling-shutter readout introduces under ego-motion and vibration."
  - term: "Dropped frame"
    plain: "A picture the camera took but that never reached the software. The robot sees a small jump in time it does not know about, and has to guess what happened during the gap."
    technical: "A discontinuity in the publisher's header sequence counter, indicating loss in the capture, transport or subscriber queue rather than at the sensor."
  - term: "Jitter"
    plain: "Pictures are supposed to arrive at a perfectly steady beat. Jitter is how much that beat wobbles. An occasional long pause is far more damaging than a steady slight unevenness."
    technical: "Variance in inter-frame arrival intervals; the tail of the distribution matters far more than the mean because a single long stall breaks feature tracking continuity."
  - term: "Timestamp and time base"
    plain: "The moment written on each picture saying when it was taken. If two sensors write their times using two different clocks, the software will confidently combine readings that did not happen together."
    technical: "The header stamp, which must derive from a single monotonic time source shared across all sensors; relative clock drift appears as a trend in the header-to-arrival latency."
  - term: "frame_id"
    plain: "A label on every measurement saying which part of the robot it was measured from. Without it, a distance is just a number with no idea what it is measured relative to."
    technical: "The coordinate frame identifier in a message header, resolved against the TF tree; it must be unique per physical sensor to avoid ambiguity when several cameras exist."
  - term: "SVO2 recording"
    plain: "A saved copy of everything the camera saw and felt during a drive, which can be played back later exactly as if it were happening live."
    technical: "The ZED SDK's native container storing compressed raw stereo streams plus inertial data, replayed through the SDK so depth is re-derived rather than baked in at record time."
  - term: "Dataset manifest"
    plain: "The written record attached to a recording saying exactly how it was made — which camera, mounted how, in what weather, using which software version. The video is unusable without it after a few months."
    technical: "Structured provenance metadata capturing hardware identity, software versions, calibration state, mount revision and environmental conditions, stored as YAML and JSON beside the recording."
  - term: "Soak test"
    plain: "Running something for a long time on purpose, because some faults only show up after ten minutes — things get hot, small errors accumulate, and a weak connection eventually stumbles."
    technical: "Sustained-load validation revealing thermal throttling, clock drift and low-rate intermittent link errors that short smoke tests cannot distinguish from noise."
  - term: "Ground segmentation"
    plain: "Sorting the millions of measured points into 'this is the floor' and 'this is something on the floor'. The floor is the boring majority and gets thrown away; what is left is what the robot must avoid."
    technical: "Partitioning a point cloud by signed distance to an estimated ground surface, yielding a ground-removed obstacle cloud suitable as a costmap marking source."
  - term: "Plane fitting"
    plain: "Working out the tilt of the ground each time the camera looks, instead of assuming it is level. Rather like levelling a surveyor's instrument before each reading — except it has to be redone ten times a second, because the thing it is bolted to has suspension."
    technical: "Per-frame estimation of the dominant supporting surface, refined by least squares over the consensus set; absorbs camber, chassis pitch and grade into the model so the residual isolates genuine protrusions."
  - term: "RANSAC"
    plain: "A way of finding the pattern that most of the measurements agree on, while ignoring the ones that disagree. It guesses repeatedly from small random samples and keeps whichever guess the most measurements support, so a minority of wildly wrong readings cannot drag the answer off."
    technical: "Random Sample Consensus: iterative hypothesise-and-verify fitting, robust to a high outlier fraction because the model is generated from minimal samples and scored by inlier count rather than by total squared error."
  - term: "Seeded fit"
    plain: "Telling the fitting process roughly where to look before it starts. Without that hint it will confidently pick the biggest flat thing in view, which on a narrow pavement is very often the wall of a building rather than the ground."
    technical: "Constraining the hypothesis space using a prior from the TF tree — rejecting candidate planes beyond a bounded tilt from vertical or offset from the origin — which eliminates the dominant-vertical-surface failure mode of unconstrained RANSAC."
  - term: "Camber"
    plain: "The deliberate sideways slope built into a road or pavement so rainwater runs off it rather than sitting in puddles. Usually one or two percent, which sounds like nothing but adds up to several centimetres across a wide view."
    technical: "Transverse gradient specified for surface drainage, typically 1-2%; large enough that a fixed-height ground filter cannot distinguish it from a low obstacle at the edges of the field of view."
  - term: "Up-step and down-step"
    plain: "Which way the ground jumps at an edge. A step up is a kerb the robot cannot climb. A step down is the drop into the road, and it is far more dangerous — because there is nothing there to see, it looks exactly like clear space."
    technical: "The sign of the height discontinuity across adjacent ground cells. Positive steps are untraversable geometry; negative steps are negative obstacles, invisible to height-band filters and actively cleared by raytracing, so they require dedicated marking."
  - term: "Negative obstacle"
    plain: "A hazard made of absence — a hole, a kerb drop, a missing paving slab. Everything designed to spot obstacles looks for something being there, so a hazard defined by nothing being there slips straight through."
    technical: "A void or downward discontinuity in the support surface. Fails min_obstacle_height tests by construction and is reinforced rather than corrected by raytrace clearing, hence the near-lip marking and virtual-obstacle injection used here."
  - term: "Costmap observation source"
    plain: "A feed of 'here is something in the way' that the navigation system subscribes to when deciding where it is safe to drive. Each feed has its own settings for how far it is trusted and whether it is allowed to declare space empty again."
    technical: "A named sensor input to costmap_2d's obstacle layer, with independent marking/clearing semantics, height band, obstacle_range, raytrace_range and staleness expectations."
  - term: "Blind zone"
    plain: "The patch of ground too close to the robot for the camera to see, because of where it is mounted and how wide its view is. The robot drives through it on memory of what it saw a moment earlier."
    technical: "The near-field region excluded by the intersection of vertical FOV, mounting height and pitch, and minimum stereo range; bounded here at 1.018 m ahead of the front bumper — computed from the measured mount of 2026-08-29, with the camera height taken above the FLOOR rather than above base_link, and with the vertical FOV taken as the datasheet's 45 degrees rather than the 52 degrees this project had been carrying from memory — and mitigated by costmap persistence plus a speed cap rather than by sensing."

inputs:
  - "The ZED X camera itself, over its GMSL2 coaxial link into the ZED Link Quad capture card"
  - "`config/zedx_front.yaml` — resolution, frame rate, depth quality and exposure settings for the driver"
  - "`config/validation_thresholds.yaml` — what counts as healthy, with the reasoning behind every number"
  - "Previously recorded `.svo2` files, when replaying instead of using the live camera"
  - "Rosbag files, when auditing a recording after the fact with no camera attached"
  - "`config/obstacle_segmenter.yaml` — every ground, obstacle and kerb threshold, each with its derivation and what measurement would confirm it"
  - "`sidewalk_bringup/config/robot_frames.yaml` — the authoritative camera mounting, read at startup rather than copied, so that re-measuring the robot immediately changes the geometry the segmenter reasons from"
  - "The live transform tree, used to express the camera's point cloud in the robot's own coordinate frame before anything is measured"

outputs:
  - "Rectified left and right images, a depth image and a point cloud, all namespaced per camera"
  - "The motion sensor stream at its full four hundred readings per second"
  - "Camera calibration data, which later phases read to configure ORB-SLAM3 rather than hardcoding numbers"
  - "A pass, warn or fail verdict on stream health, with a measured number justifying every single check"
  - "A machine-readable validation report in `logs/sidewalk_perception/`, for the evaluation phase to load"
  - "SVO2 recordings, and optionally matching rosbags, under `data/recordings/`"
  - "A manifest in YAML and JSON beside every recording, plus a `DATASET.html` page anyone can read"
  - "An index page listing every dataset and flagging which ones have incomplete records"
  - "`/sidewalk_perception/obstacles_cloud` — the ground-removed obstacle cloud, in the robot's frame. This is the feed the local costmap steers by, and navigation preflight treats its absence as a hard failure"
  - "`/sidewalk_perception/curb_scan` — detected kerb and drop edges, as one distance per direction. Never used to declare space empty, only to declare it blocked"
  - "`/sidewalk_perception/curb_cloud` and `/sidewalk_perception/ground_cloud` — visualisation aids for RViz; nothing in the navigation stack reads them"
  - "A run log recording, for every session, how many frames were processed, how many lacked a transform, and how often the ground fit fell back to its starting assumption"

how_to_run:
  - cmd: "rosrun sidewalk_perception perception_common.py"
    explain: "Run this first on any new machine. It prints what it can detect — Jetson OS version, ZED SDK version, capture card driver, whether the camera daemon is running, which video devices exist — and then prints the predicted depth uncertainty at a range of distances. It touches no hardware and changes nothing. It is the fastest way to answer whether the camera stack is installed at all."
  - cmd: "roslaunch sidewalk_perception zedx_front.launch"
    explain: "Starts the camera. Everything appears under `/zedx_front/`, and every coordinate frame carries that same prefix, which is what will let the rear-facing camera be added later without the two colliding."
  - cmd: "rosrun sidewalk_perception obstacle_segmenter.py --geometry"
    explain: "Prints the whole geometric argument with live numbers, and needs no camera, no ROS and no numpy. It reads the camera mounting from sidewalk_bringup rather than assuming it, then derives where the ground first enters view, how deep the resulting blind zone in front of the robot is, how the depth error grows with distance, and every distance at which kerb detection stops being trustworthy — including the ones that depend on how hard the point cloud is thinned, with whichever one actually binds marked. Run this before arguing with any threshold — and run it again after the robot is physically measured, because every number changes with the mounting."
  - cmd: "rosrun sidewalk_perception obstacle_segmenter.py --self-test"
    explain: "Runs seventy checks on synthetic point data using nothing but the Python standard library. It verifies the ground fit, the kerb classifier and the scan conversion, and several cases are deliberately adversarial — one demonstrates that an unconstrained fit really does choose a building wall as the ground, and another that a drop-off is completely invisible to a height filter. Run it after changing any threshold: it also asserts the relationships between thresholds, so it will catch a change that quietly breaks an assumption the algorithm depends on."
  - cmd: "roslaunch sidewalk_perception obstacle_segmenter.launch"
    explain: "Starts the segmenter against an already-running camera, publishing the obstacle cloud and the kerb scan that the navigation costmap subscribes to. This is what closes the critical navigation preflight check. It waits for the camera rather than failing if it starts first, and every ten seconds it logs the fitted ground tilt, the inlier fraction and how many kerb steps it is seeing, which is the quickest way to tell whether it is working or merely running."
  - cmd: "roslaunch sidewalk_perception validate_sensors.launch"
    explain: "The main event. Starts the camera and watches it for fifteen minutes, then prints a verdict on every check with the measured number behind it. Run this after any change to hardware, driver, SDK, mount or settings, and before any recording session that matters."
  - cmd: "roslaunch sidewalk_perception validate_sensors.launch quick:=true"
    explain: "A sixty-second version, for confirming the camera is alive after plugging it in. It is genuinely useful but it is not a substitute for the full run — thermal throttling and clock drift need ten minutes or more before they become visible, so a quick test that passes only proves nothing is catastrophically wrong."
  - cmd: "rosrun sidewalk_perception frame_audit.py --bag data/recordings/NAME/NAME.bag --verbose"
    explain: "Audits coordinate frame names and timestamps inside an existing recording. Needs no camera, no robot and no roscore, so it runs at a desk days after the drive. With the verbose option it prints the timestamp and frame name of each message, which is the behaviour of the earlier read_frame_id.py tool this replaces."
  - cmd: "roslaunch sidewalk_perception record_dataset.launch duration:=600"
    explain: "Records a ten-minute drive, both as an SVO2 and as a rosbag, and writes a manifest stub alongside them. Fill in the description afterwards with the manifest editor — several fields, especially anything that went wrong, are only known once the drive is over."
  - cmd: "rosrun sidewalk_perception make_manifest.py schema"
    explain: "Prints the full provenance record structure and, for the fields most often filled in badly, an explanation of what a good answer looks like and why that field turns out to matter."
  - cmd: "rosrun sidewalk_perception make_manifest.py validate data/recordings/NAME"
    explain: "Checks whether a recording's provenance record is complete, and names precisely which fields are missing and why each one cannot be recovered later. A dataset that fails this should not be used to support a published result."
  - cmd: "rosrun sidewalk_perception svo_manager.py list"
    explain: "Lists every recording with its size and description, and flags any that have no provenance record attached."
  - cmd: "rosrun sidewalk_perception svo_manager.py verify data/recordings/NAME"
    explain: "Checks a recording is complete and readable before anyone builds a result on it. Catches truncated files from a full disk and rosbags that were killed rather than stopped cleanly."
  - cmd: "roslaunch sidewalk_perception playback_svo.launch svo_file:=/absolute/path/NAME.svo2"
    explain: "Replays a recording as if the camera were live, publishing the identical set of topics. This is the launch file that makes the three-way algorithm comparison possible — every algorithm sees exactly the same drive."

failure_modes:
  - symptom: "Navigation preflight fails on `/sidewalk_perception/obstacles_cloud`, and the local costmap shows no live obstacles at all"
    cause: "The obstacle segmenter is not running. This is the exact defect the node was written to close: the navigation stack has always subscribed to that topic and marked it critical, and for a while nothing in this package published it"
    fix: "Start it with `roslaunch sidewalk_perception obstacle_segmenter.launch`. If it starts and immediately exits, read the one line it prints — every non-zero exit here is a named missing dependency (numpy, tf2_ros, no ROS master) rather than a crash. Note that the robot in this state is not merely degraded: it plans entirely on the recorded map and will drive into anything that was not present when the map was made."
  - symptom: "The segmenter runs and publishes, but the obstacle cloud is empty or nearly empty on a scene that clearly has obstacles in it"
    cause: "Usually the region of interest does not overlap where the ground actually is, or the ground plane fit has latched onto the wrong surface"
    fix: "Run the node's geometry mode first — it prints exactly where the ground enters view (about 1.38 m ahead of the robot centre with the current mounting) and the region of interest must start inside that. Then watch the heartbeat line in the run log: it reports the fitted tilt, the offset and the inlier percentage every ten seconds. A tilt near zero with a low inlier percentage means the fit is falling back to its starting assumption every frame, which the log says explicitly."
  - symptom: "Kerbs appear on `/sidewalk_perception/curb_scan` in RViz but never show up in the costmap"
    cause: "A height-filter mismatch between this package and the navigation configuration. costmap_2d places a laser scan at the height of its frame origin and then filters it; `base_link` sits at ground level, z = 0, so if the curb source in `costmap_common.yaml` demands a height above zero, every return is discarded"
    fix: "The curb source in `sidewalk_navigation/config/costmap_common.yaml` originally required a height above 0.02 m and would have thrown away every kerb. It now allows down to -0.05 m, and that file explains why. If this symptom returns, check that number first, and check that the scan is still published in a frame whose origin is on the ground. This has NOT been observed on hardware — no camera is wired — but it follows directly from the two configuration files, and it fails silently, which is why it is listed first among the things to check."
  - symptom: "The pavement itself is suddenly marked as a solid band of obstacle near a kerb"
    cause: "The ground plane fit has settled on the ROADWAY rather than the sidewalk. Both surfaces are near-horizontal and both pass the offset gate, so whichever contributes more points wins, and close to an edge that can be the road"
    fix: "A known limitation of the current fit, stated rather than hidden. Confirm it by watching the reported plane offset in the log — it will sit roughly one kerb height below zero. Narrowing `roi_y_abs_max` so less roadway is in view is the immediate mitigation; preferring the plane the robot is actually standing on, rather than the one with the most support, is the proper fix and is not yet implemented."
  - symptom: "Curb detection works close in and simply stops further out, with no error message"
    cause: "Range limits, only one of which is deliberate. The deliberate one: past about 5 m the depth error smears the edge position by more than one costmap cell, so detection is suppressed on purpose. The undeliberate one: to keep up with the camera the node throws away all but roughly one point in sixty before it builds its ground grid, and a grid square needs at least three points to count. Depending on how that thinning lines up with the image rows, squares may start coming up empty somewhere between four and five metres — which is closer in than the limit the software thinks it is enforcing. Both are silent"
    fix: "Run the geometry mode. It now prints every limiting distance, including the two that depend on how aggressively the cloud is thinned, and marks whichever one actually binds. THIS IS AN OPEN ITEM, not settled behaviour: the two thinning models disagree by more than a metre and neither has been checked against a real camera. The measurement that settles it is to record a drive past a known kerb and log how many grid squares survive at each distance. Do not raise the detection range to compensate; either keep more points, at a cost in processing time that must be timed on the Jetson first, or lower the stated range to whatever the measurement supports."
  - symptom: "The node refuses to start, saying numpy is not installed"
    cause: "Deliberate. The pure-Python reference implementation is correct but roughly a hundred times too slow to keep the costmap fresh at ten frames a second"
    fix: "Install numpy on the Jetson (it ships with the ROS Noetic base install, so its absence usually means the wrong Python interpreter is being used). The node refuses rather than running slowly on purpose: publishing late would trip the costmap's staleness expectation and leave navigation steering on obstacles that have moved, which is more dangerous than not publishing at all. The self-test and geometry modes do not need numpy and still work."
  - symptom: "The validator reports no messages arrived, and names which topics were silent"
    cause: "The chain from cable to driver is broken somewhere, and the tool walks that chain outward to find the first break"
    fix: "Read its diagnosis rather than guessing — it distinguishes four different causes. No `/dev/video*` devices means the capture card is not seen by the kernel at all, so check the card is seated and its separate 9-19 V supply is connected. Devices present but no `zed_x_daemon` means the daemon that owns the GMSL2 cameras is dead; start it with `sudo systemctl start zed_x_daemon`. No SDK under `/usr/local/zed` means the software was never installed. If all of those are fine, the driver is publishing under a different namespace — compare `rostopic list | grep -i zed` against what the validator was watching."
  - symptom: "Everything works, then stops after several minutes, and often recovers if left alone"
    cause: "The Jetson is thermally throttling under sustained load, or the GMSL2 link is marginal"
    fix: "Watch `tegrastats` during a soak run and see whether the clocks drop when the failures begin. This is exactly the failure a sixty-second test cannot find, which is why the default soak is fifteen minutes. If temperature is not the cause, reseat the FAKRA connector — it carries both data and power over one coax, so a marginal contact drops frames intermittently rather than failing cleanly."
  - symptom: "Depth looks plausible nearby but wrong far away, and the point cloud spreads out at range"
    cause: "This is usually correct behaviour being misread as a fault"
    fix: "Depth uncertainty grows with the square of distance. At 15 m this camera is expected to be roughly 0.4 m uncertain, and beyond about 20 m the spread becomes very visible. Run `perception_common.py` to print the predicted uncertainty at each distance and compare against what you are seeing. Only treat it as a fault if the observed spread is much worse than predicted."
  - symptom: "Large areas of the depth image are blank, especially on plain ground"
    cause: "Stereo matching needs visible texture, and a featureless surface provides none"
    fix: "Blank regions on smooth concrete, fresh asphalt, snow, standing water or sky are physics, not a fault — with nothing to match between the two images there is no disparity to measure. Wet asphalt is markedly worse than dry because it reflects rather than scatters. Record the surface conditions in the dataset manifest so the effect can be accounted for later. Treat it as a real fault only when validity approaches zero on a clearly textured scene."
  - symptom: "The validator fails timestamp monotonicity, and mapping had been silently producing nothing"
    cause: "Timestamps went backwards, and RTAB-Map discards out-of-order data without an error message"
    fix: "There is no acceptable rate of time running backwards, so any occurrence fails. Check whether the driver and the rest of the system are stamping from different clocks by setting `sensors/sensors_timestamp_sync` in `config/zedx_front.yaml`. If the driver runs on a different machine from the consumer, run NTP on both and confirm they agree to within a few milliseconds."
  - symptom: "Dropped frames counted by sequence number and by timing disagree substantially"
    cause: "The two methods measure different things, and the disagreement is itself the diagnosis"
    fix: "The validator explains which way the discrepancy points. A much higher timing estimate means frames are arriving late rather than going missing — the stream is bunching and stalling, which points at CPU contention or thermal throttling rather than the GMSL2 link. A higher sequence count means frames vanished without leaving a gap in time, which points at the driver's queue depth. Trust the sequence count for how many frames were actually lost."
  - symptom: "A frame name is flagged as not carrying the camera prefix"
    cause: "The driver is publishing generic ZED frame names instead of per-camera ones"
    fix: "Set `general/camera_name` in `config/zedx_front.yaml` so frames come out as `zedx_front_left_camera_optical_frame` rather than bare `zed_left_camera_optical_frame`. Fix this now, while only one camera exists. Once the rear-facing camera is fitted and publishing the same names, the transform tree holds two different physical meanings for one name, and the resulting map is wrong with nothing crashing and no error shown."
  - symptom: "An image topic is flagged for not using an optical frame"
    cause: "Image data is being published in a body-convention frame"
    fix: "Image coordinates run Z forward, X right, Y down; the robot body convention runs X forward, Y left, Z up. Confusing the two rotates the entire reconstruction by 90 degrees. The frame name for an image topic should contain `optical`. This is a very common first-week bug and it produces a map that looks coherent but is oriented wrongly."
  - symptom: "roslaunch stops immediately with `resource not found: zed_wrapper`"
    cause: "zed-ros-wrapper has not been built in this workspace"
    fix: "That wrapper is built by hand from its Noetic branch against the ZED SDK, and is deliberately not declared as a dependency so that this package still configures on a machine without the SDK. Build it, or pass `start_driver:=false` to work against a bag or an SVO replay instead."
  - symptom: "A recording exists but nobody can say what it contains"
    cause: "It was made without a manifest, and the details are no longer recoverable"
    fix: "Run `make_manifest.py create` on it now and fill in whatever anyone still remembers, marking the rest honestly as unknown. Nothing can recover the SDK version or exposure settings after the fact. The lesson is to record the manifest at capture time, which `record_dataset.launch` does automatically."
  - symptom: "The recording stopped partway through and the file is unreadable"
    cause: "The disk filled up mid-drive, or the process was killed rather than stopped cleanly"
    fix: "The recorder estimates the size before starting and refuses to begin without about thirty percent headroom, so this should be caught in advance. If a rosbag was killed with SIGKILL it will be left unindexed — repair it with `rosbag reindex`. Stop recordings with Ctrl-C, which lets the index be written."
  - symptom: "Everything passes, but the map is still wrong"
    cause: "The camera mounting offsets have not been measured"
    fix: "This package validates the data stream, not the geometry of how the camera is bolted on. Those offsets live in `sidewalk_bringup` and default to zero, which is certainly wrong. Measure them, and remember that angular error dominates — one degree of pitch error displaces a point 20 m away by about 35 cm."

files:
  - path: "scripts/obstacle_segmenter.py"
    role: "Turns the camera's point cloud into the two feeds navigation consumes: obstacles with the drivable ground removed, and kerb/drop edges. Fits the ground plane every frame under a mounting-derived constraint, classifies height steps by sign, and treats drops to the roadway as the most dangerous case. Carries a self-test that exercises the whole pipeline on synthetic data with no camera, no ROS and no numpy."
  - path: "config/obstacle_segmenter.yaml"
    role: "Every ground, obstacle and kerb threshold, each with the physics it was derived from and what measurement would confirm or refute it. Also records the cross-package height-filter hazard between the curb scan and the navigation costmap."
  - path: "launch/obstacle_segmenter.launch"
    role: "Starts the segmenter. Does not start the camera by default, because in normal bringup the driver is already running and a second one would fight it for the device."
  - path: "scripts/perception_common.py"
    role: "Shared foundation — hardware constants, environment probing, the stereo depth physics, streaming statistics, and the graceful-degradation machinery. Run it directly to see what the current machine has installed."
  - path: "scripts/sensor_validator.py"
    role: "The main measurement node. Frame rate, dropped frames, timestamp monotonicity, jitter, time-base consistency, IMU rate, frame names and depth validity, judged against documented thresholds."
  - path: "scripts/frame_audit.py"
    role: "Offline audit of coordinate frame names and timestamps in a bag or a live stream. Successor to the earlier read_frame_id.py, and runs with no camera or roscore."
  - path: "scripts/svo_manager.py"
    role: "Record, inspect, verify and replay SVO2 files — the mechanism that lets every phase re-run on identical data instead of re-driving the robot."
  - path: "scripts/make_manifest.py"
    role: "The dataset provenance system. Creates, validates and renders the record attached to every recording, including the human-readable DATASET.html page."
  - path: "config/zedx_front.yaml"
    role: "ZED X driver settings, with the reasoning for each choice — why 30 FPS and not 60, why exposure is capped, why the SDK's own tracker publishes no transform."
  - path: "config/validation_thresholds.yaml"
    role: "What counts as a healthy stream. Every threshold carries the physical consequence it was derived from, so a result sitting near a limit can be interpreted rather than guessed at."
  - path: "config/perception.rviz"
    role: "Visualisation layout for inspecting the stream by eye — useful for motion blur and vibration artefacts, which no metric here captures."
  - path: "launch/zedx_front.launch"
    role: "Starts the camera, namespaced per camera so the second one can be added later."
  - path: "launch/validate_sensors.launch"
    role: "Camera plus the full fifteen-minute validation soak."
  - path: "launch/record_dataset.launch"
    role: "Records a drive to SVO2 and rosbag together, with a manifest stub."
  - path: "launch/playback_svo.launch"
    role: "Replays a recording as if it were live — the foundation of the three-way comparison."

logs: "logs/sidewalk_perception/"
